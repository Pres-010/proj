<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sisky AI - Business Assistant</title>
    <style>
        :root {
            --bg: #1a3a34;
            --card: #0f2820;
            --card-soft: #1a3a34;
            --text: #f0f5f3;
            --muted: #a0b0ad;
            --accent: #ff9d5c;
            --accent-soft: rgba(255, 157, 92, 0.15);
            --border: #2d5047;
            --surface: #152d28;
            --green-dark: #0d1f1c;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, #1a3a34 0%, #0d1f1c 100%);
        }
        body.light-mode {
            --bg: #f4f7ff;
            --card: #ffffff;
            --card-soft: #f3f6ff;
            --text: #111827;
            --muted: #6b7280;
            --accent: #4f46e5;
            --accent-soft: rgba(79, 70, 229, 0.15);
            --border: #d1d5db;
            --surface: #f8fafc;
        }
        * { box-sizing: border-box; }
        button, input, select { font: inherit; cursor: pointer; }
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar-main {
            width: 340px;
            background: linear-gradient(180deg, #1a3a34 0%, #0d1f1c 100%);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
        }
        .new-chat-btn {
            width: 100%;
            padding: 14px 16px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .new-chat-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .conversation-item {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
            color: var(--text);
        }
        .conversation-item:hover {
            background: rgba(255, 157, 92, 0.1);
            border-color: var(--accent);
        }
        .conversation-item.active {
            background: rgba(255, 157, 92, 0.2);
            border-color: var(--accent);
            color: var(--accent);
        }
        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h2 {
            margin: 0;
            font-size: 18px;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 20px;
            gap: 16px;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 4px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user-msg {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
        }
        .message.ai-msg {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .message.loading {
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }
        .input-area {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .input-area input {
            flex: 1;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            resize: none;
            max-height: 100px;
        }
        .input-area input::placeholder {
            color: var(--muted);
        }
        .input-area button {
            padding: 14px 24px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .input-area button:hover:not(:disabled) {
            opacity: 0.9;
        }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .auth-page {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
        }
        .auth-card h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }
        .auth-card p {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 500;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
        }
        .form-group input::placeholder {
            color: var(--muted);
        }
        .auth-actions {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-primary {
            padding: 12px 16px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-secondary {
            padding: 12px 16px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .auth-footer {
            margin-top: 16px;
            color: var(--muted);
            font-size: 14px;
        }
        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
        }
        .error-message {
            display: none;
            color: #ff6b6b;
            margin-top: 12px;
            padding: 12px;
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 8px;
            font-size: 13px;
        }
        .error-message.show {
            display: block;
        }
        .hidden { display: none !important; }
        .scrollbar-hide { scrollbar-width: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @media (max-width: 800px) {
            .sidebar-main { width: 280px; }
            .message { max-width: 90%; }
        }
        @media (max-width: 600px) {
            .app-container { flex-direction: column; }
            .sidebar-main { width: 100%; height: 200px; border-right: none; border-bottom: 1px solid var(--border); }
            .main-content { height: calc(100vh - 200px); }
            .auth-card { padding: 24px; }
        }
    </style>
</head>
<body>
    <!-- Authentication Pages -->
    <div id="loginPage" class="auth-page hidden">
        <div class="auth-card">
            <h1>Welcome to Sisky AI</h1>
            <p>Your business assistant for entrepreneurs in Kigali, Rwanda.</p>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>
            <div class="auth-actions">
                <button class="btn-primary" onclick="login()">Sign In</button>
                <button class="btn-secondary" onclick="showRegisterPage()">Create Account</button>
                <button class="btn-secondary" onclick="skipLogin()">Continue as Guest</button>
            </div>
            <div class="error-message" id="loginError"></div>
            <p class="auth-footer">New to Kigali AI? <a onclick="showRegisterPage()">Sign up here</a></p>
        </div>
    </div>

    <div id="registerPage" class="auth-page hidden">
        <div class="auth-card">
            <h1>Create Your Account</h1>
            <p>Join Kigali AI and get personalized business guidance.</p>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="registerEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="registerPassword" placeholder="Create a password">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="registerConfirm" placeholder="Confirm your password">
            </div>
            <div class="form-group">
                <label>Starting Plan</label>
                <select id="registerPlan">
                    <option value="basic">Basic (Free)</option>
                    <option value="pro">Pro</option>
                    <option value="promax">Pro Max</option>
                </select>
            </div>
            <div class="auth-actions">
                <button class="btn-primary" onclick="register()">Create Account</button>
                <button class="btn-secondary" onclick="skipLogin()">Continue as Guest</button>
            </div>
            <div class="error-message" id="registerError"></div>
            <p class="auth-footer">Already have an account? <a onclick="showLoginPage()">Sign in</a></p>
        </div>
    </div>

    <!-- Main App -->
    <div id="appContainer" class="app-container hidden">
        <!-- Sidebar -->
        <div class="sidebar-main">
            <div class="sidebar-header">
                <div class="logo">📍 Kigali AI</div>
                <button class="new-chat-btn" onclick="newConversation()">+ New Conversation</button>
            </div>
            <div class="conversations-list scrollbar-hide" id="conversationsList"></div>
            <div class="sidebar-footer">
                <button class="btn-secondary" style="width: 100%;" onclick="showSettings()">⚙️ Settings</button>
                <button class="btn-secondary" style="width: 100%; margin-top: 10px;" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-content">
            <div class="chat-header">
                <div>
                    <h2 id="chatTitle">Kigali AI</h2>
                    <small style="color: var(--muted); font-size: 13px;" id="userInfo">Guest Mode</small>
                </div>
                <small style="color: var(--muted);" id="planInfo">Basic Plan</small>
            </div>

            <div class="chat-area">
                <div class="messages-container" id="messagesContainer"></div>
                <div class="input-area">
                    <input 
                        type="text" 
                        id="chatInput" 
                        placeholder="Ask about markets, registration, or business growth in Kigali..." 
                        onkeypress="if(event.key==='Enter' && !event.shiftKey) sendMessage()"
                    />
                    <button id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000;">
        <div class="auth-card" style="max-width: 400px; position: relative;">
            <button onclick="closeSettings()" style="position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 24px; color: var(--text); cursor: pointer;">×</button>
            <h1>Settings</h1>
            <div class="form-group">
                <label>Language</label>
                <select id="languageSelect" onchange="updateSetting('language', this.value)">
                    <option value="English">English</option>
                    <option value="French">Français</option>
                    <option value="German">Deutsch</option>
                    <option value="Kinyarwanda">Kinyarwanda</option>
                </select>
            </div>
            <div class="form-group">
                <label>Theme</label>
                <select id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                </select>
            </div>
            <button class="btn-primary" style="width: 100%;" onclick="closeSettings()">Close</button>
        </div>
    </div>

    <script>
        // Performance optimizations and cache
        const state = {
            conversations: [],
            currentConversation: null,
            isLoading: false,
            cache: new Map(),
            messageQueue: []
        };
        }
        .card {
            border-radius: 24px;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 28px;
        }
        .content-area {
            display: none;
        }
        .content-area.active {
            display: block;
        }
        .chat-messages {
            min-height: 420px;
            max-height: 520px;
            padding: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 84%;
            padding: 16px 18px;
            border-radius: 20px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(109, 125, 248, 0.95), rgba(96, 111, 244, 0.95));
            color: #fff;
        }
        .message.assistant {
            align-self: flex-start;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text);
        }
        .chat-input-area {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 14px;
            margin-top: 18px;
        }
        .chat-input-area input {
            width: 100%;
            border-radius: 18px;
            border: 1px solid var(--border);
            padding: 18px 20px;
            background: var(--surface);
            color: var(--text);
        }
        .chat-input-area button {
            min-width: 120px;
            border-radius: 18px;
            border: none;
            background: var(--accent);
            color: white;
            padding: 0 24px;
            font-weight: 700;
            cursor: pointer;
        }
        .chat-input-area button:hover {
            opacity: 0.9;
        }
        .history-list {
            display: grid;
            gap: 14px;
        }
        .history-item {
            padding: 18px;
            border-radius: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: start;
        }
        .history-role {
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--accent);
            margin-bottom: 8px;
        }
        .history-delete {
            background: #ef4444;
            border: none;
            color: white;
            padding: 12px 14px;
            border-radius: 16px;
            cursor: pointer;
            height: fit-content;
        }
        .history-delete:hover {
            background: #dc2626;
        }
        .plan-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }
        .plan-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            display: grid;
            gap: 14px;
        }
        .plan-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(109, 125, 248, 0.18);
        }
        .plan-card h3 {
            margin: 0;
        }
        .plan-card ul {
            padding-left: 18px;
            margin: 0;
            color: var(--muted);
            list-style: none;
        }
        .plan-card li::before {
            content: "✓";
            margin-right: 8px;
            color: var(--accent);
        }
        .plan-card button {
            margin-top: 16px;
            padding: 14px 18px;
            border: none;
            border-radius: 16px;
            background: var(--accent);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        .plan-card button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: rgba(109,125,248,0.45);
        }
        .settings-group {
            margin-bottom: 20px;
        }
        .settings-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            opacity: 0.85;
        }
        .settings-group select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
        }
        .hidden { display: none !important; }
        @media (max-width: 1100px) {
            .hero { grid-template-columns: 1fr; }
            .zero-state { grid-template-columns: 1fr; }
            .dashboard { grid-template-columns: 1fr; }
            .sidebar { min-height: auto; }
        }
        @media (max-width: 820px) {
            .page-shell { padding: 16px; }
            .hero-card, .auth-panel, .card { padding: 24px; }
            .chat-messages { min-height: 320px; }
            .chat-input-area { grid-template-columns: 1fr; }
            .chat-input-area button { width: 100%; }
        }
    </style>
</head>

                        <small>Flexible sidebar, quick responses, guest mode enabled.</small>
                    </div>
                    <div style="display:flex; gap:12px; flex-wrap:wrap;">
                        <button class="action-button secondary" onclick="toggleSidebar()">Toggle sidebar</button>
                        <button class="action-button secondary" onclick="toggleTheme()">Theme</button>
                    </div>
                </div>
                <div id="chatTab" class="card content-area active">
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="Ask about markets, registration, or business growth in Kigali..." onkeypress="if(event.key==='Enter') sendMessage()">
                        <button onclick="sendMessage()">Send</button>
                    </div>
                </div>
                <div id="historyTab" class="card content-area">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px;">
                        <div>
                            <h3 style="margin:0;">Conversation History</h3>
                            <p style="margin:6px 0 0; color: var(--muted);">Manage your recent chats quickly.</p>
                        </div>
                        <button class="action-button secondary" onclick="clearAllHistory()">Clear history</button>
                    </div>
                    <div class="history-list" id="historyList"></div>
                </div>
                <div id="settingsTab" class="card content-area">
                    <h3>Settings</h3>
                    <div class="settings-group">
                        <label>Language</label>
                        <select id="languageSetting" onchange="updateSetting('language', this.value)">
                            <option value="English">English</option>
                            <option value="French">French</option>
                            <option value="German">German</option>
                            <option value="Kinyarwanda">Kinyarwanda</option>
                        </select>
                    </div>
                    <div class="settings-group">
                        <label>Theme</label>
                        <select id="themeSetting" onchange="changeTheme(this.value)">
                            <option value="Light">Light</option>
                            <option value="Dark">Dark</option>
                        </select>
                    </div>
                    <div class="settings-group">
                        <label>Google Search</label>
                        <select id="googleSearchSetting" onchange="updateSetting('use_google', this.value)">
                            <option value="Yes">Enabled</option>
                            <option value="No">Disabled</option>
                        </select>
                    </div>
                </div>
                <div id="paymentsTab" class="card content-area">
                    <h3>Payment Plans</h3>
                    <div class="plan-cards" id="planCards"></div>
                </div>
            </section>
        </div>
    </div>
    <script>
        const API = {
            register: async (email, password, confirmPassword, plan) => {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password, confirm_password: confirmPassword, plan})
                });
                return res.json();
            },
            login: async (email, password) => {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                return res.json();
            },
            skip: async () => {
                const res = await fetch('/api/auth/skip', {method: 'POST'});
                return res.json();
            },
            logout: async () => {
                await fetch('/api/auth/logout', {method: 'POST'});
            },
            checkSession: async () => {
                const res = await fetch('/api/auth/session');
                return res.json();
            },
            chat: async (message) => {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message})
                });
                return res.json();
            },
            getHistory: async () => {
                const res = await fetch('/api/history');
                return res.json();
            },
            deleteHistory: async (id) => {
                await fetch(`/api/history/${id}`, {method: 'DELETE'});
            },
            clearHistory: async () => {
                await fetch('/api/history/clear', {method: 'POST'});
            },
            getSettings: async () => {
                const res = await fetch('/api/settings');
                return res.json();
            },
            updateSetting: async (key, value) => {
                await fetch('/api/settings', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({key, value})
                });
            },
            getPayments: async () => {
                const res = await fetch('/api/payments');
                return res.json();
            },
            upgradePlan: async (plan) => {
                const res = await fetch('/api/payments/upgrade', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({plan})
                });
                return res.json();
            }
        };
        
        function showLogin() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('authForms').classList.remove('hidden');
            document.getElementById('loginFormBlock').classList.remove('hidden');
            document.getElementById('registerFormBlock').classList.add('hidden');
        }
        
        function showRegister() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('authForms').classList.remove('hidden');
            document.getElementById('loginFormBlock').classList.add('hidden');
            document.getElementById('registerFormBlock').classList.remove('hidden');
        }
        
        async function skipLogin() {
            const result = await API.skip();
            if (result.success) {
                showApp(result.email, result.plan);
            }
        }
        
        async function register() {
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerConfirm').value;
            const plan = document.getElementById('registerPlan').value;
            const errorDiv = document.getElementById('registerError');
            
            errorDiv.style.display = 'none';
            if (!email || !password || !confirm) {
                errorDiv.textContent = 'All fields required';
                errorDiv.style.display = 'block';
                return;
            }
            
            const result = await API.register(email, password, confirm, plan);
            if (result.error) {
                errorDiv.textContent = result.error;
                errorDiv.style.display = 'block';
            } else {
                showApp(result.user.email, result.user.plan);
            }
        }
        
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            errorDiv.style.display = 'none';
            if (!email || !password) {
                errorDiv.textContent = 'Email and password required';
                errorDiv.style.display = 'block';
                return;
            }
            
            const result = await API.login(email, password);
            if (result.error) {
                errorDiv.textContent = result.error;
                errorDiv.style.display = 'block';
            } else {
                showApp(result.user.email, result.user.plan);
            }
        }
        
        async function logout() {
            await API.logout();
            sessionStorage.removeItem('theme');
            document.body.classList.remove('light-mode');
            document.body.classList.add('dark-mode');
            document.getElementById('sidebar').classList.remove('collapsed');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('authForms').classList.add('hidden');
            document.getElementById('appContainer').classList.add('hidden');
        }
        
        function showApp(email = 'Guest', plan = 'basic') {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('authForms').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('userEmail').textContent = email || 'Guest';
            document.getElementById('userPlan').textContent = plan || 'basic';
            document.getElementById('chatMessages').innerHTML = '';
            loadSettings();
            loadPayments();
            switchTab(null, 'chat');
        }
        
        async function switchTab(event, tab) {
            document.querySelectorAll('.content-area').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-card button').forEach(el => el.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
            if (tab === 'history') loadHistory();
        }
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }
        
        async function toggleTheme() {
            const current = document.body.classList.contains('dark-mode') ? 'Dark' : 'Light';
            const next = current === 'Dark' ? 'Light' : 'Dark';
            await changeTheme(next);
            document.getElementById('themeSetting').value = next;
        }
        
        async function changeTheme(theme) {
            if (theme === 'Dark') {
                document.body.classList.add('dark-mode');
                document.body.classList.remove('light-mode');
            } else {
                document.body.classList.add('light-mode');
                document.body.classList.remove('dark-mode');
            }
            sessionStorage.setItem('theme', theme);
        }
        
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.innerHTML += `<div class="message user">${message}</div>`;
            input.value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            const result = await API.chat(message);
            if (result.response) {
                messagesDiv.innerHTML += `<div class="message assistant">${result.response}</div>`;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }
        
        async function loadHistory() {
            const data = await API.getHistory();
            const historyList = document.getElementById('historyList');
            if (!data.history || data.history.length === 0) {
                historyList.innerHTML = '<p style="padding: 20px; text-align: center; color: var(--muted);">No history yet</p>';
                return;
            }
            historyList.innerHTML = data.history.map(item => `
                <div class="history-item">
                    <div>
                        <div class="history-role">${item.role.toUpperCase()}</div>
                        <div>${item.message.substring(0, 140)}</div>
                    </div>
                    <button class="history-delete" onclick="deleteHistoryItem(${item.id})">Delete</button>
                </div>
            `).join('');
        }
        
        async function deleteHistoryItem(id) {
            await API.deleteHistory(id);
            loadHistory();
        }
        
        async function clearAllHistory() {
            if (confirm('Delete all history?')) {
                await API.clearHistory();
                loadHistory();
            }
        }
        
        async function loadSettings() {
            const data = await API.getSettings();
            const settings = data.settings;
            document.getElementById('languageSetting').value = settings.language || 'English';
            document.getElementById('themeSetting').value = settings.theme || 'Dark';
            document.getElementById('googleSearchSetting').value = settings.use_google || 'No';
            await changeTheme(settings.theme || 'Dark');
        }
        
        async function updateSetting(key, value) {
            await API.updateSetting(key, value);
        }
        
        async function loadPayments() {
            const data = await API.getPayments();
            const cardsDiv = document.getElementById('planCards');
            const features = data.features;
            cardsDiv.innerHTML = data.plans.map(plan => `
                <div class="plan-card ${plan === data.current_plan ? 'active' : ''}">
                    <h3>${plan.toUpperCase()}</h3>
                    <ul>
                        ${features[plan].map(f => `<li>${f}</li>`).join('')}
                    </ul>
                    <button onclick="upgradePlan('${plan}')" ${plan === data.current_plan ? 'disabled' : ''}>
                        ${plan === data.current_plan ? 'Current plan' : 'Choose plan'}
                    </button>
                </div>
            `).join('');
        }
        
        async function upgradePlan(plan) {
            const result = await API.upgradePlan(plan);
            if (result.success) {
                document.getElementById('userPlan').textContent = plan;
                loadPayments();
            }
        }
        
        window.addEventListener('load', async () => {
            const storedTheme = sessionStorage.getItem('theme');
            if (storedTheme) await changeTheme(storedTheme);
            const session = await API.checkSession();
            if (session.authenticated) {
                showApp(session.email, session.plan);
            }
        });
    </script>
</body>
</html>
